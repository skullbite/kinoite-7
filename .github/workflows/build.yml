---
name: Build container image (Dev)
on:
  pull_request:
    branches:
      - dev
  # schedule:
  #  - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - dev
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  
  prepare_env:
    name: Prepare Environment
    runs-on: ubuntu-24.04
    outputs:
      image_registry: ${{ steps.env.outputs.IMAGE_REGISTRY }}  
      base_image_name: ${{ steps.env.outputs.BASE_IMAGE_NAME }}
      default_tag: ${{ steps.env.outputs.DEFAULT_TAG }}
      target_branch: ${{ steps.env.outputs.TARGET_BRANCH }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
          
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check
            
      - name: Prepare environment
        id: env  
        run: |
          IMAGE_NAME=$(just image_name)
          DEFAULT_TAG=$(just generate-default-tag)
          
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_OUTPUT}
          echo "BASE_IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_OUTPUT}
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> ${GITHUB_OUTPUT}
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> ${GITHUB_OUTPUT}
          
  build_push_main:
    name: Build and push (kinoite-7)  
    needs: prepare_env  
    uses: ./.github/workflows/build-img.yml
    secrets: inherit
    with:
      image-name: ${{ needs.prepare_env.outputs.base_image_name }}
      default-tag: ${{ needs.prepare_env.outputs.default_tag }} 
      target-branch: ${{ needs.prepare_env.outputs.target_branch }}

  build_push_gamer:
    name: Build and push (kinoite-7-gamer)  
    needs: prepare_env  
    uses: ./.github/workflows/build-img.yml
    secrets: inherit
    with:
      image-name: ${{ needs.prepare_env.outputs.base_image_name }}-gamer
      default-tag: ${{ needs.prepare_env.outputs.default_tag }}
      target-branch: ${{ needs.prepare_env.outputs.target_branch }}
      
  build_push_nvidia:
     name: Build and push (kinoite-7-nvidia)  
     needs: prepare_env  
     uses: ./.github/workflows/build-img.yml
     secrets: inherit
     with:
      image-name: ${{ needs.prepare_env.outputs.base_image_name }}-nvidia
      default-tag: ${{ needs.prepare_env.outputs.default_tag }}
      target-branch: ${{ needs.prepare_env.outputs.target_branch }}

  build_push_gamer_nvidia:
     name: Build and push (kinoite-7-gamer-nvidia)  
     needs: prepare_env  
     uses: ./.github/workflows/build-img.yml
     secrets: inherit
     with:
      image-name: ${{ needs.prepare_env.outputs.base_image_name }}-gamer-nvidia
      default-tag: ${{ needs.prepare_env.outputs.default_tag }}
      target-branch: ${{ needs.prepare_env.outputs.target_branch }}
